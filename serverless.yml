service: iot-simulator
provider:
  name: aws
  runtime: python3.12
  region: ${file(secrets.json):AWS_REGION}  # Change to your preferred AWS region
  deploymentBucket:
    name: ${file(secrets.json):DEPLOYMENT_BUCKET}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - iot:Publish
          Resource:
            - "arn:aws:iot:${aws:region}:${aws:accountId}:topic/$aws/things/*/shadow/update"
            - "arn:aws:iot:${aws:region}:${aws:accountId}:topic/devices/*/telemetry"

functions:
  iam-based:
    handler: handler.lambda_handler  #python file.function name
    timeout: 10
    events:
      # Trigger 1: Run whenever a device shadow delta occurs
      - iot:
          name: "DeviceShadowDeltaRule"
          sql: "SELECT *, topic(3) AS thing_name FROM '$aws/things/+/shadow/update/delta'"
      
resources:
  Resources:
    TelemetrySchedulerInvokeRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: scheduler.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: InvokeTelemetryLambda
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource:
                    Fn::GetAtt:
                      - IamDashbasedLambdaFunction
                      - Arn

    TelemetrySchedule:
      Type: AWS::Scheduler::Schedule
      Properties:
        Name: ${self:service}-${sls:stage}-iam-based-telemetry
        State: ENABLED
        ScheduleExpression: rate(30 minutes)
        FlexibleTimeWindow:
          Mode: "OFF"
        Target:
          Arn:
            Fn::GetAtt:
              - IamDashbasedLambdaFunction
              - Arn
          RoleArn:
            Fn::GetAtt:
              - TelemetrySchedulerInvokeRole
              - Arn
          Input: '{"thing_name":"tb-freezer-001","telemetry":{"room_temperature":-5.0,"exterior_temperature":15.0}}'
